[project]
name = "python-doc-parser"
version = "0.1.0"
description = "Document Intelligence Backend"
readme = "README.md"
authors = [
    { name = "prashant10times", email = "prashant@10times.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.3",
]

[tool.uv.build-backend]
module-name = "app"

[tool.pyright]
venvPath = "/Users/prashanttanwar/Desktop/research/python-doc-parser"
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src", "."]
testpaths = ["tests"]
